<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Second Look{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  {% block head %}{% endblock %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <nav aria-label="Site navigation">
      <a href="/" aria-label="Second Look home">Second Look</a>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer role="contentinfo">
    <p>Second Look is in early development. Slide images are generated by LibreOffice and may differ slightly from how they appear in PowerPoint.</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
